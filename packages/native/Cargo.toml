[package]
name = "solo-native"
version = "0.4.0"
edition = "2021"
description = "GPUI bindings for Node.js via napi-rs"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["napi8", "serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
futures = "0.3"
url = "2"

# GPUI is consumed as a pinned git dependency — no Zed checkout required.
# All three crates must use the same repo + rev so Cargo resolves one graph;
# see docs/gpui-dependency.md.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d8a29e1e2f65b6be6c176f90af801286ac11cc4", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d8a29e1e2f65b6be6c176f90af801286ac11cc4", default-features = false, features = ["font-kit", "wayland", "x11"] }
thiserror = "2"
tree-sitter = { version = "0.26.11", optional = true }
tree-sitter-highlight = { version = "0.26.11", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
pulldown-cmark = { version = "0.12", default-features = false }
unicode-segmentation = "1"

# macOS text/graphics deps - pinned to avoid core-graphics version conflicts
# core-text 21.1.0 uses core-graphics 0.25 which conflicts with font-kit's core-graphics 0.24
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
tempfile = "3"
core-text = "=21.0.0"
core-graphics = "=0.24.0"
# Production runs MacPlatform's ordinary loop; tests use the native Metal renderer.
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "1d8a29e1e2f65b6be6c176f90af801286ac11cc4", default-features = false, features = ["font-kit"] }
# `<webview>` hosts a WKWebView. Versions are pinned to the ones gpui_macos
# already resolves — a second objc2 build would produce duplicate,
# incompatible `NSView`/`WKWebView` types.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSGraphics", "NSButton", "NSCell", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "NSWorkspace", "NSPasteboard", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSBundle", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL", "NSURLRequest"] }
block2 = "0.6.2"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKFoundation", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKWindowFeatures"] }
# Public route to the window's NSView, so <webview> needs no change to the
# pinned GPUI fork.
raw-window-handle = "0.6"

# Live automation screenshots read the window back from the X server. Both
# crates are already in the graph through gpui_linux and gpui.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# `_exit`, so a quit that JS does not finish skips the UI thread's TLS
# destructors; see `exit_after_quit` in renderer/mod.rs.
libc = "0.2"
raw-window-handle = "0.6"
x11rb = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
# `menuBar`: a StatusNotifierItem over D-Bus, with no GTK of its own. The
# blocking API runs the service on its own thread, so the UI thread never
# awaits D-Bus.
ksni = { version = "0.3", features = ["blocking"] }

# `<webview>`: a WebKitGTK child of the GPUI X11 window (see
# `native_view/webview_linux.rs`). GTK3 + WebKit 6.0 API (webkit2gtk-4.1);
# GNOME and Wayland embedding does not exist, so this only builds on Linux.
# Optional: linking WebKitGTK makes it a runtime dependency of the addon, so
# only apps that use `<webview>` enable the `webview-linux` feature.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"], optional = true }
gdkx11 = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", features = ["v2_40"], optional = true }
javascriptcore = { version = "1.1", package = "javascriptcore-rs", optional = true }
x11-dl = { version = "2", optional = true }
async-channel = { version = "1", optional = true }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "1d8a29e1e2f65b6be6c176f90af801286ac11cc4", default-features = false, features = ["font-kit"] }

[features]
# Syntax highlighting is opt-in: its grammars are about 8 MB of the library,
# and without them `code`, `diff` and markdown code blocks render plain.
# test-support enables every grammar so the highlighter stays tested.
default = ["automation"]
automation = []
# `<webview>` on Linux embeds WebKitGTK. Opt-in because its libraries become
# DT_NEEDED entries of the addon, and an app that never renders a webview
# should not need WebKitGTK installed. Without it the element reports the
# same `loadError` path the Wayland case uses.
webview-linux = [
    "dep:gtk",
    "dep:gdkx11",
    "dep:webkit2gtk",
    "dep:javascriptcore",
    "dep:x11-dl",
    "dep:async-channel",
]
profiling = ["gpui/profiler"]
syntax = ["dep:tree-sitter", "dep:tree-sitter-highlight"]
syntax-rust = ["syntax", "dep:tree-sitter-rust"]
syntax-javascript = ["syntax", "dep:tree-sitter-javascript"]
syntax-typescript = ["syntax-javascript", "dep:tree-sitter-typescript"]
syntax-python = ["syntax", "dep:tree-sitter-python"]
syntax-go = ["syntax", "dep:tree-sitter-go"]
syntax-json = ["syntax", "dep:tree-sitter-json"]
syntax-bash = ["syntax", "dep:tree-sitter-bash"]
syntax-toml = ["syntax", "dep:tree-sitter-toml-ng"]
syntax-markdown = ["syntax", "dep:tree-sitter-md"]
syntax-html = ["syntax", "dep:tree-sitter-html"]
syntax-css = ["syntax", "dep:tree-sitter-css"]
syntax-yaml = ["syntax", "dep:tree-sitter-yaml"]
syntax-c = ["syntax", "dep:tree-sitter-c"]
syntax-all = [
    "syntax-rust",
    "syntax-javascript",
    "syntax-typescript",
    "syntax-python",
    "syntax-go",
    "syntax-json",
    "syntax-bash",
    "syntax-toml",
    "syntax-markdown",
    "syntax-html",
    "syntax-css",
    "syntax-yaml",
    "syntax-c",
]
test-support = [
    "automation",
    "profiling",
    "syntax-all",
    "webview-linux",
    "gpui/test-support",
    "gpui_platform/test-support",
    "gpui_macos/test-support",
    "gpui_macos/font-kit",
]

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# Tests use gpui's TestAppContext. A dev-dependency feature reaches only test,
# example and bench builds, so the lean release addon stays without it.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d8a29e1e2f65b6be6c176f90af801286ac11cc4", default-features = false, features = ["font-kit", "test-support"] }

[[example]]
name = "hello"
path = "examples/hello.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
