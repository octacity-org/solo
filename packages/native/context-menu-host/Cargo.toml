[package]
name = "solo-context-menu"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSCell", "NSEvent", "NSGraphicsContext", "NSRunningApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSObject", "NSProcessInfo", "NSString"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }

[[bin]]
name = "solo-context-menu"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
