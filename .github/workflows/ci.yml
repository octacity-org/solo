name: CI
env:
  APP_NAME: solo-native
  MACOSX_DEPLOYMENT_TARGET: "10.13"
"on":
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # ── macOS (Metal) ──────────────────────────────────────────
          # default features include test-support (TestGpuixRenderer)
          - host: macos-latest
            target: aarch64-apple-darwin
            build: bun run build --target aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            build: bun run build --target x86_64-apple-darwin
          # ── Linux (Vulkan/wgpu) ────────────────────────────────────
          # build:release skips test-support (pulls gpui_macos, macOS-only)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: bun run build:release --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build: bun run build:release --target aarch64-unknown-linux-gnu
          # ── Windows (Direct3D/wgpu) ────────────────────────────────
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: bun run build:release --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: bun run build:release --target aarch64-pc-windows-msvc
    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: packages/native
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      # Reads the channel from rust-toolchain.toml, which must match zed's
      # pin for the gpui revision in packages/native/Cargo.toml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.settings.target }}
          # this workflow caches cargo explicitly in the next step
          cache: false
          # the action defaults to RUSTFLAGS="-D warnings"; keep lint policy
          # in the crate instead of letting CI deny every warning
          rustflags: ""

      # gpui_apple compiles shaders with `metal`, which Xcode 26 no longer
      # ships by default. Without this the build fails with
      # "cannot execute tool 'metal' due to missing Metal Toolchain".
      - name: Install Metal toolchain
        if: contains(matrix.settings.target, 'apple-darwin')
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/target/
          key: ${{ matrix.settings.target }}-cargo-${{ hashFiles('packages/native/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-

      # Linux system deps for GPUI (Vulkan, Wayland, X11, fonts)
      # Based on longbridge/gpui-component and Zed's script/linux
      - name: Install Linux dependencies
        if: contains(matrix.settings.target, 'linux')
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y \
            gcc g++ clang \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers

      - name: Install dependencies
        working-directory: .
        run: bun install

      - name: Build native
        run: ${{ matrix.settings.build }}
        shell: bash

      # The macOS builds above use default features; packaged apps ship the
      # lean build, so check it too (napi cfg mistakes only fail there).
      - name: Check lean macOS build
        if: matrix.settings.target == 'aarch64-apple-darwin'
        run: cargo check --release --no-default-features --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            packages/native/${{ env.APP_NAME }}.*.node
            packages/native/solo-context-menu.darwin-*
          if-no-files-found: error

  test:
    name: test
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install dependencies
        run: bun install

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-apple-darwin
          path: packages/native/

      - name: Run @solo/core tests
        run: bun run test
        working-directory: packages/core

      # Artifact downloads do not preserve Unix executable permissions.
      - name: Prepare native menu helper
        run: chmod +x packages/native/solo-context-menu.darwin-arm64

      - name: Test native menu helper protocol
        run: cargo nextest run --manifest-path packages/native/context-menu-host/Cargo.toml

      - name: Build @solo/core
        run: bun run build
        working-directory: packages/core

      - name: Run native tests
        run: cargo nextest run --features test-support --lib --test layout_probe
        working-directory: packages/native

      - name: Run @solo/solid tests
        run: bun run test
        working-directory: packages/solid

      - name: Build @solo/solid
        run: bun run build
        working-directory: packages/solid

      # The fixtures import @solo/solid's built types, so this follows the build.
      - name: Type-check Solid JSX fixtures
        run: bun run typecheck
        working-directory: packages/solid

      - name: Build tasks automation fixture
        run: bun run build
        working-directory: examples/tasks

      - name: Run tasks automation regression
        run: bun run test
        working-directory: examples/tasks
